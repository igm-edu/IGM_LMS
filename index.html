<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGM 이러닝</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="card">
    <h1 class="brand">IGM 이러닝</h1>

    <section id="view-login">
      <h2>로그인</h2>
      <form id="form-login" novalidate>
        <label>이메일<input type="email" name="email" autocomplete="email" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
        <p class="message" id="message-login" role="alert"></p>
        <button type="submit">로그인</button>
      </form>
      <p class="switch">처음이신가요? <button type="button" class="link" id="go-signup">회원가입</button></p>
    </section>

    <section id="view-signup" hidden>
      <h2>회원가입</h2>
      <form id="form-signup" novalidate>
        <label>이름<input name="name" autocomplete="name" required></label>
        <label>이메일<input type="email" name="email" autocomplete="email" required></label>
        <label>비밀번호<input type="password" name="password" autocomplete="new-password" required>
          <span class="hint">8자 이상, 영문과 숫자를 모두 포함</span></label>
        <label>연락처<input name="phone" autocomplete="tel" required></label>
        <label>소속<input name="company" autocomplete="organization" required></label>
        <label>직급<input name="position" autocomplete="organization-title" required></label>
        <label>생년월일<input type="date" name="birth_date" required></label>
        <label class="consent">
          <input type="checkbox" name="consent" required>
          <span>개인정보 수집·이용에 동의합니다. 이름·이메일·연락처·소속·직급·생년월일을
          수강 관리와 수료증 발급에 사용하며, 수료 후 3년간 보관합니다.</span>
        </label>
        <p class="message" id="message-signup" role="alert"></p>
        <button type="submit">가입하고 시작하기</button>
      </form>
      <p class="switch">이미 계정이 있으신가요? <button type="button" class="link" id="go-login">로그인</button></p>
    </section>

    <section id="view-home" hidden>
      <h2>내 과정</h2>
      <p><strong id="home-name"></strong><span id="home-company"></span></p>
      <p class="message" id="message-home" role="alert"></p>
      <ul class="list" id="my-class-list"></ul>
      <p class="note" id="my-class-empty" hidden>수강 중인 과정이 없습니다.</p>
      <p class="switch" id="home-admin" hidden><a href="admin.html">클래스 관리</a></p>
      <button type="button" id="do-logout">로그아웃</button>
    </section>

    <section id="view-lessons" hidden>
      <p class="switch"><button type="button" class="link" id="back-to-home">← 내 과정</button></p>
      <h2 id="lessons-title"></h2>
      <p class="note" id="lessons-summary"></p>
      <p class="note" id="lessons-completion"></p>
      <p class="message" id="message-lessons" role="alert"></p>
      <ul class="list" id="my-lesson-list"></ul>
      <p class="note" id="my-lesson-empty" hidden>등록된 차시가 없습니다.</p>
    </section>

    <section id="view-player" hidden>
      <p class="switch"><button type="button" class="link" id="back-to-lessons">← 차시 목록</button></p>
      <h2 id="player-title"></h2>
      <video id="player" controls playsinline preload="metadata"></video>
      <p class="note" id="player-progress"></p>
      <p class="message" id="message-player" role="alert"></p>
      <p class="switch" id="player-quiz" hidden>
        <button type="button" class="secondary" id="go-quiz">퀴즈 풀기</button>
      </p>
    </section>

    <section id="view-quiz" hidden>
      <p class="switch"><button type="button" class="link" id="back-to-player">← 차시로</button></p>
      <h2 id="quiz-title"></h2>
      <p class="note" id="quiz-info"></p>
      <p class="note" id="quiz-history"></p>
      <form id="form-quiz-take" novalidate>
        <ol class="questions" id="question-fields"></ol>
        <p class="message" id="message-quiz-take" role="alert"></p>
        <button type="submit" id="submit-quiz">제출하기</button>
      </form>
      <p class="note" id="quiz-result"></p>
    </section>
  </main>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
